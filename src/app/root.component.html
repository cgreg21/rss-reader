<div #shell class="fixed inset-0 flex h-screen touch-pan-y flex-col overflow-hidden bg-bg pl-[env(safe-area-inset-left)] pr-[env(safe-area-inset-right)] sidebar:flex-row"
     (pointerdown)="onDown($event)" (pointermove)="onMove($event)" (pointerup)="onUp($event)" (pointercancel)="onUp($event)">
  <div class="flex min-h-0 min-w-0 flex-1 flex-col sidebar:order-last">
    <rss-top-bar [actions]="onArticles()" />

    <main [rssPullRefresh]="refresh" #pull="pullRefresh" class="min-h-0 flex-1 overflow-y-auto overscroll-contain p-3.5 sm:p-5 sidebar:px-8 sidebar:py-6">
      <div class="flex items-end justify-center overflow-hidden text-xs text-muted" [class.transition-[height]]="!pull.pulling()"
           [style.height.px]="pull.distance()" aria-live="polite">
        @if (pull.distance() > 0) { <span class="pb-2">{{ pull.label() }}</span> }
      </div>
      @if (!store.online()) { <div class="banner">Hors ligne : les articles enregistrés restent lisibles.</div> }
      <router-outlet />
    </main>
    @if (onArticles()) {
      <nav class="bg-side px-2.5 py-1 sidebar:hidden"><rss-article-actions /></nav>
    }
  </div>

  <rss-app-prompt />
  <rss-snackbar />
  <rss-dialog />
  @if (!drawerActive()) {
    <div #edge class="absolute inset-y-0 left-0 z-20 w-6 touch-none" aria-hidden="true"></div>
  }

  <div class="absolute inset-0 z-30 bg-black/55 sidebar:hidden"
       [class]="dragging() ? '' : 'transition-opacity duration-200'"
       [class.pointer-events-none]="!drawer.opened() && !dragging()"
       [style.opacity]="backdropOpacity()"
       (click)="onBackdropClick()"></div>

  <aside class="absolute inset-y-0 left-0 z-30 flex w-[280px] shrink-0 touch-pan-y flex-col overflow-hidden bg-side p-3 pt-[calc(20px+env(safe-area-inset-top))] shadow-2xl ease-out sidebar:static sidebar:order-first sidebar:pt-4 sidebar:shadow-none"
         [class]="dragging() ? '' : 'transition-transform duration-200'"
         [style.transform]="layout.sidebar() ? null : 'translateX(' + drawerX() + 'px)'"
         [attr.inert]="drawerActive() ? null : ''">
    <rss-drawer-content />
  </aside>
</div>
