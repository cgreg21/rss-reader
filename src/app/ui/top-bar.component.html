<header class="flex items-center justify-between gap-2 bg-side px-2.5 pb-1.5 pt-[calc(14px+env(safe-area-inset-top))] sidebar:px-8 sidebar:pt-3">
  <button class="icon-btn relative sidebar:hidden" type="button" aria-label="Menu" (click)="drawer.show()">{{ ui.menu }}
    @if (store.unreadTotal() > 0) {
      <span class="absolute right-0.5 top-0.5 min-w-[18px] rounded-full bg-accent px-1 text-center font-sans text-[11px] font-bold leading-[18px] text-white">{{ store.unreadTotal() > 99 ? '99+' : store.unreadTotal() }}</span>
    }
  </button>
  <strong class="min-w-0 flex-1 truncate text-center sidebar:text-left   sidebar:flex-none sidebar:text-xl">{{ store.scopeTitle() || 'RSS' }}
    <small class="hidden text-[15px] font-normal text-muted sidebar:inline">({{ store.unreadTotal() }} non lus)</small></strong>
    <input class="field hidden w-full max-w-md sidebar:ml-auto sidebar:block" type="search" placeholder="Rechercher" aria-label="Rechercher"
      [value]="store.search()" (input)="store.search.set($any($event.target).value)">
    @if (actions()) { <div class="hidden sidebar:block"><rss-article-actions /></div> }
    <button class="icon-btn sidebar:hidden" type="button" aria-label="Rechercher" [attr.aria-expanded]="searching()" (click)="toggleSearch()">{{ ui.search }}</button>
</header>
@if (searching()) {
  <div class="bg-side px-3 pb-2.5 sidebar:hidden">
    <input #field class="field w-full" type="search" placeholder="Rechercher" aria-label="Rechercher"
      [value]="store.search()" (input)="store.search.set($any($event.target).value)">
  </div>
}
