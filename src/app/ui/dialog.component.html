@if (dialog.current(); as d) {
  <div class="fixed inset-0 z-[60] grid place-items-center bg-black/60 p-4" (click)="dialog.dismiss()">
    <div class="w-full max-w-sm rounded-2xl border border-line bg-side p-5 shadow-2xl" role="dialog" aria-modal="true"
      [attr.aria-label]="d.title || d.message" (click)="$event.stopPropagation()">
      @if (d.title) { <h2 class="mb-2 text-lg font-semibold">{{ d.title }}</h2> }
      @if (d.message) { <p class="whitespace-pre-line text-muted">{{ d.message }}</p> }
      @if (d.input; as input) {
        <input #field class="field mt-3 w-full" [type]="input.type || 'text'" [placeholder]="input.placeholder || ''"
          [value]="d.text" (input)="dialog.setText($any($event.target).value)"
          (keydown.enter)="dialog.close(d.submitValue)">
      }
      <div class="mt-5 flex justify-end gap-2">
        @for (b of d.buttons; track b.label) {
          <button type="button" [class]="b.kind === 'ghost' ? 'btn-ghost' : b.kind === 'danger' ? 'btn !bg-red-500 !text-white' : 'btn'"
            (click)="dialog.close(b.value)">{{ b.label }}</button>
        }
      </div>
    </div>
  </div>
}
