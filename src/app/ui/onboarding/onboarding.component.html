@if (onboarding.opened()) {
  <div class="fixed inset-0 z-[55] grid place-items-center bg-side lg:bg-black/60 lg:p-4" animate.enter="anim-fade-in" animate.leave="anim-fade-out">
    <div class="flex h-full w-full flex-col overflow-y-auto bg-side pb-[env(safe-area-inset-bottom)] pt-[env(safe-area-inset-top)] lg:h-auto lg:max-w-[min(26rem,100%)] lg:overflow-hidden lg:rounded-2xl lg:border lg:border-line lg:p-0 lg:shadow-2xl" role="dialog" aria-modal="true"
         [attr.aria-label]="slide().title | translate" animate.enter="anim-pop-in"
         (touchstart)="touchStart($event)" (touchend)="touchEnd($event)">
      <div class="flex items-center justify-between gap-3 px-5 pt-3">
        <span class="text-xs text-muted">{{ 'onboarding.step' | translate: { n: index() + 1, total: slides.length } }}</span>
        <button type="button" class="rounded-xl px-3 py-1.5 text-sm text-muted hover:text-slate-100" (click)="skip()">{{ 'onboarding.skip' | translate }}</button>
      </div>

      <div class="grid flex-1 lg:flex-none">
        @for (s of [slide()]; track s.id) {
          <div class="stagger col-start-1 row-start-1 flex flex-col items-center justify-center px-6 pb-2 pt-4 text-center lg:min-h-[17rem] lg:justify-start"
               [style.--slide-dir]="direction() * i18n.sign()" animate.enter="anim-slide-in" animate.leave="anim-slide-out" aria-live="polite">
            <span class="mb-5 grid size-28 place-items-center rounded-full bg-accent/15 font-mdi text-7xl text-accent lg:mb-4 lg:size-20 lg:text-5xl" aria-hidden="true">{{ s.icon }}</span>
            <h2 class="text-2xl font-bold lg:text-xl">{{ s.title | translate }}</h2>
            <p class="mt-3 max-w-prose text-base leading-relaxed text-muted lg:text-[15px]">{{ s.text | translate }}</p>
            @if (s.action; as action) {
              <button type="button" class="btn-ghost mt-4" (click)="run(s)">{{ action.label | translate }}</button>
            }
          </div>
        }
      </div>

      <div class="flex justify-center gap-1.5 py-3" role="tablist">
        @for (s of slides; track s.id; let i = $index) {
          <button type="button" role="tab" class="h-2 rounded-full transition-all duration-300" [class]="i === index() ? 'w-5 bg-accent' : 'w-2 bg-line hover:bg-muted'"
            [attr.aria-selected]="i === index()" [attr.aria-label]="s.title | translate" (click)="go(i)"></button>
        }
      </div>

      <div class="flex items-center justify-between gap-2 px-5 pb-6 lg:pb-5">
        <button type="button" class="btn-ghost transition-opacity duration-300" [class.invisible]="index() === 0" [class.opacity-0]="index() === 0" [attr.aria-hidden]="index() === 0" (click)="step(-1)">{{ 'common.previous' | translate }}</button>
        <button type="button" class="btn transition-colors duration-300" (click)="next()">{{ (last() ? 'onboarding.start' : 'common.next') | translate }}</button>
      </div>
    </div>
  </div>
}
