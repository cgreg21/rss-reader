@if (onboarding.opened()) {
  <div class="fixed inset-0 z-[55] grid place-items-center bg-black/60 p-4" animate.enter="anim-fade-in" animate.leave="anim-fade-out">
    <div class="flex w-full max-w-[min(26rem,100%)] flex-col overflow-hidden rounded-2xl border border-line bg-side shadow-2xl" role="dialog" aria-modal="true"
         [attr.aria-label]="slide().title | translate" animate.enter="anim-pop-in"
         (touchstart)="touchStart($event)" (touchend)="touchEnd($event)">
      <div class="flex items-center justify-between gap-3 px-5 pt-3">
        <span class="text-xs text-muted">{{ 'onboarding.step' | translate: { n: index() + 1, total: slides.length } }}</span>
        <button type="button" class="rounded-xl px-3 py-1.5 text-sm text-muted hover:text-slate-100" (click)="skip()">{{ 'onboarding.skip' | translate }}</button>
      </div>

      @for (s of [slide()]; track s.id) {
        <div class="flex min-h-[17rem] flex-col items-center px-6 pb-2 pt-4 text-center" animate.enter="anim-fade-in" aria-live="polite">
          <span class="mb-4 grid size-20 place-items-center rounded-full bg-accent/15 font-mdi text-5xl text-accent" aria-hidden="true">{{ s.icon }}</span>
          <h2 class="text-xl font-bold">{{ s.title | translate }}</h2>
          <p class="mt-3 text-[15px] leading-relaxed text-muted">{{ s.text | translate }}</p>
          @if (s.action; as action) {
            <button type="button" class="btn-ghost mt-4" (click)="run(s)">{{ action.label | translate }}</button>
          }
        </div>
      }

      <div class="flex justify-center gap-1.5 py-3" role="tablist">
        @for (s of slides; track s.id; let i = $index) {
          <button type="button" role="tab" class="h-2 rounded-full transition-all" [class]="i === index() ? 'w-5 bg-accent' : 'w-2 bg-line hover:bg-muted'"
            [attr.aria-selected]="i === index()" [attr.aria-label]="s.title | translate" (click)="index.set(i)"></button>
        }
      </div>

      <div class="flex items-center justify-between gap-2 px-5 pb-5">
        <button type="button" class="btn-ghost" [class.invisible]="index() === 0" [attr.aria-hidden]="index() === 0" (click)="step(-1)">{{ 'common.previous' | translate }}</button>
        <button type="button" class="btn" (click)="next()">{{ (last() ? 'onboarding.start' : 'common.next') | translate }}</button>
      </div>
    </div>
  </div>
}
